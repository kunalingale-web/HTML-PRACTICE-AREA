<!DOCTYPE html>
<html lang="en">
<head>
    <title>INDIAN CITIZENSHIP REGISTRATION FORM</title>
</head>
<body>
    <center>
        <h1>CITIZEN PERSONAL DETAILS</h1>
        <hr>

              <form action="aug11.html" >
            <table cellpadding="10" border="10">
                <tr>
                    <td>Name:</td>
                    <td><input type="text" name="name" placeholder="Name" required></td>
                </tr>
                <tr>
                    <td>Middle Name:</td>
                    <td><input type="text" name="FATHER NAME" placeholder="Father Name " required></td>
                </tr>
                <tr>
                    <td>Last Name:</td>
                    <td><input type="text" name="SURNAME" placeholder="Surname" required></td>
                </tr>
                <tr>
                    <td>Date of Birth:</td>
                    <td><input type="date" name="dob" required></td>
                </tr>
                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="Male" required> Male
                        <input type="radio" name="gender" value="Female" required > Female
                        <input type="radio" name="gender" value="Other" required> Other
                    </td>
                </tr>
                <tr>
                    <td>Aadhar ID:</td>
                    <td><input type="text" name="adhar" placeholder="0000 0000 0000" required></td>
                </tr>
                <tr>
                    <td>Address:</td>
                    <td><textarea name="address" rows="3" cols="25" placeholder="Enter Address" required></textarea></td>
                </tr>
                <tr>
                    <td>State:</td>
                    <td>
                        <select name="state">
                            <option value="MAHARASHTRA">Maharashtra</option>
                            <option value="GOA">Goa</option>
                            <option value="GUJARAT">Gujarat</option>
                            <option value="KERALA">Kerala</option>
                            <option value="JHARKHAND">Jharkhand</option>
                            <option value="HIMACHAL PRADESH">Himachal Pradesh</option>
                            <option value="ODISHA">Odisha</option>
                            <option value="NAGALAND">Nagaland</option>
                            <option value="RAJASTHAN">Rajasthan</option>
                            <option value="SIKKIM">Sikkim</option>
                            <option value="UTTAR PRADESH">Uttar Pradesh</option>
                        </select>
                  </td>
                  </tr>
                <tr>
                          <td>District:</td>
                    <td>
                        <select name="district">
                            <option value="MH1">MH 1</option>
                            <option value="MH2">MH 2</option>
                            <option value="MH3">MH 3</option>

                            <option value="GO1">GO1</option>
                            <option value="GO2">GO2</option>
                            <option value="GO3">GO3</option>

                            <option value="GUJARAT">GUJ1</option>
                            <option value="GUJARAT">GUJ2</option>
                            <option value="GUJARAT">GUJ3</option>

                            <option value="KERALA">KER1</option>
                            <option value="KERALA">KER2</option>
                            <option value="KERALA">KER3</option>

                           <option value="JHARKHAND">JHAR1</option>
                           <option value="JHARKHAND">JHAR2</option>
                           <option value="JHARKHAND">JHAR3</option>

                           <option value="HIMACHAL PRADESH">HIM1</option>
                           <option value="HIMACHAL PRADESH">HIM2</option>
                           <option value="HIMACHAL PRADESH">HIM3</option>

                           <option value="ODISHA">ODI1</option>
                           <option value="ODISHA">ODI2</option>
                           <option value="ODISHA">ODI3</option>

                           <option value="NAGALAND">NAGA1</option>
                           <option value="NAGALAND">NAGA2</option>
                           <option value="NAGALAND">NAGA3</option>

                           <option value="RAJASTHAN">RAJ1</option>
                           <option value="RAJASTHAN">RAJ2</option>
                           <option value="RAJASTHAN">RAJ3</option>

                           <option value="SIKKIM">SIK1</option>
                           <option value="SIKKIM">SIK2</option>
                           <option value="SIKKIM">SIK3</option>

                           <option value="UTTAR PRADESH">UP1</option>
                           <option value="UTTAR PRADESH">UP2</option>
                           <option value="UTTAR PRADESH">UP3</option>      
                            
                      </select>
                  </td>
             </tr>
             <tr>
                    <td>Aadhar File (≤5MB):</td>
                    <td></Picture><input type="file" name="" placeholder="Profile Picture" required></td>
               </tr>
                <tr>
                    <td>Passport Photo (≤5MB):</td>
                    <td> </Picture><input type="file" name="" placeholder="Profile Picture" required></td>
              </tr>
               <tr>
                 <td colspan="2" align="center">
                  <button type="submit">Save Details</button>
         </td>
     </tr>
     </table>
     </form>
    </center>
</body>
</html>
